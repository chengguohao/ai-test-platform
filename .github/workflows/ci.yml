name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11']
        node: ['18']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Backend import smoke
        working-directory: backend
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -c "from app.main import app; print('backend import OK')"

      - name: pytest-bdd collect smoke
        working-directory: pytest-bdd
        run: |
          python -m pip install --quiet -r requirements/test.txt
          python -m pytest --collect-only -q 2>&1 | tail -n 5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Frontend build
        working-directory: frontend
        run: |
          npm install --registry=https://registry.npmmirror.com
          npm run build